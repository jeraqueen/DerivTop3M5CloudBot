name: Build weekend cTrader bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore weekend cBot project
        run: dotnet restore src/WeekendSweepReclaim/WeekendSweepReclaim.csproj

      - name: Build weekend cBot
        run: dotnet build src/WeekendSweepReclaim/WeekendSweepReclaim.csproj --configuration Release --no-restore

      - name: Collect and verify compiled cTrader package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          mapfile -t files < <(find src/WeekendSweepReclaim/bin -type f -name '*.algo' -print)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one WeekendSweepReclaim .algo file; found ${#files[@]}"
            printf '%s\\n' "${files[@]}"
            exit 1
          fi
          cp "${files[0]}" artifacts/WeekendSweepReclaim.algo
          cp src/WeekendSweepReclaim/WeekendSweepReclaim.cs artifacts/WeekendSweepReclaim.cs
          test -s artifacts/WeekendSweepReclaim.algo
          test -s artifacts/WeekendSweepReclaim.cs
          ls -lh artifacts/WeekendSweepReclaim.algo artifacts/WeekendSweepReclaim.cs

      - name: Upload compiled cTrader bot
        uses: actions/upload-artifact@v4
        with:
          name: WeekendSweepReclaim-cTrader
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
